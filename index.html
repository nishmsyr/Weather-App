<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="config.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-background">
      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>

      <main class="main-container">
        <div class="app-header">
          <h1 class="app-title">
            <i class="fas fa-cloud-sun"></i>
            WeatherNow
          </h1>
        </div>

        <header class="input-container">
          <div class="search-wrapper">
            <input class="city-input" placeholder="Enter city name..." />
            <button class="search-btn">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </header>

        <section class="weather-info" style="display: none">
          <div class="weather-card">
            <div class="location-date-container">
              <div class="location">
                <i class="fas fa-map-marker-alt location-icon"></i>
                <h4 class="country-txt">Jasin</h4>
              </div>
              <h5 class="current-date-txt regular-txt">Sun, 18 May</h5>
            </div>

            <div class="weather-summary-container">
              <div class="weather-summary-info">
                <h1 class="temp-txt">29°</h1>
                <h3 class="condition-txt regular-txt">Clouds</h3>
              </div>
              <img
                src="./assets/weather/clouds.svg"
                alt="Weather icon"
                class="weather-summary-img"
              />
            </div>

            <div class="weather-conditions-container">
              <div class="conditions-item">
                <div class="condition-icon">
                  <i class="fas fa-tint"></i>
                </div>
                <div class="conditions-info">
                  <h5 class="condition-label">Humidity</h5>
                  <h5 class="humidity-value-txt condition-value">55%</h5>
                </div>
              </div>
              <div class="conditions-item">
                <div class="condition-icon">
                  <i class="fas fa-wind"></i>
                </div>
                <div class="conditions-info">
                  <h5 class="condition-label">Wind Speed</h5>
                  <h5 class="wind-value-txt condition-value">3 M/s</h5>
                </div>
              </div>
            </div>
          </div>

          <div class="forecast-section">
            <h3 class="forecast-title">5-Day Forecast</h3>
            <div class="forecast-item-container">
              <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">18 May</h5>
                <img
                  src="./assets/weather/thunderstorm.svg"
                  alt="Weather icon"
                  class="forecast-item-img"
                />
                <h5 class="forecast-item-temp">29°C</h5>
              </div>
              <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">19 May</h5>
                <img
                  src="./assets/weather/thunderstorm.svg"
                  alt="Weather icon"
                  class="forecast-item-img"
                />
                <h5 class="forecast-item-temp">29°C</h5>
              </div>
              <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">20 May</h5>
                <img
                  src="./assets/weather/thunderstorm.svg"
                  alt="Weather icon"
                  class="forecast-item-img"
                />
                <h5 class="forecast-item-temp">29°C</h5>
              </div>
              <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">21 May</h5>
                <img
                  src="./assets/weather/thunderstorm.svg"
                  alt="Weather icon"
                  class="forecast-item-img"
                />
                <h5 class="forecast-item-temp">29°C</h5>
              </div>
              <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">22 May</h5>
                <img
                  src="./assets/weather/thunderstorm.svg"
                  alt="Weather icon"
                  class="forecast-item-img"
                />
                <h5 class="forecast-item-temp">29°C</h5>
              </div>
            </div>
          </div>
        </section>

        <section class="search-city section-message">
          <div class="message-icon">
            <i class="fas fa-search-location"></i>
          </div>
          <div class="message-content">
            <h2>Discover Weather</h2>
            <p class="regular-txt">
              Enter a city name to get current weather conditions and forecasts
            </p>
          </div>
        </section>

        <section class="not-found section-message" style="display: none">
          <div class="message-icon error">
            <i class="fas fa-exclamation-triangle"></i>
          </div>
          <div class="message-content">
            <h2>City Not Found</h2>
            <p class="regular-txt">Please check the spelling and try again</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
